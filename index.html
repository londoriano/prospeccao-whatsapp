<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospecção WhatsApp</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root { --ancora: #17324d; --wa: #1fa855; --wa-dark: #178a45; }
  body { background: #f3f5f7; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .topo { background: var(--ancora); color: #fff; }
  .btn-wa { background: var(--wa); border-color: var(--wa); color: #fff; font-weight: 600; }
  .btn-wa:hover, .btn-wa:focus { background: var(--wa-dark); border-color: var(--wa-dark); color: #fff; }
  .btn-wa.enviado { background: #fff; color: var(--wa-dark); border-color: var(--wa); }
  .progress { height: .6rem; }
  .progress-bar { background: var(--wa); }
  td.num { font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  tr.enviada td { background: #eaf6ee; }
  tr.enviada td.num { color: #5b6b62; }
  .form-check-input { width: 1.4rem; height: 1.4rem; cursor: pointer; }
  .form-check-input:checked { background-color: var(--wa); border-color: var(--wa); }
  .tabela-wrap { max-height: 70vh; overflow: auto; }
  .tabela-wrap thead th { position: sticky; top: 0; background: #fff; z-index: 1; box-shadow: 0 1px 0 #dee2e6; }
</style>
</head>
<body>

<header class="topo py-3 mb-4">
  <div class="container">
    <h1 class="h4 mb-0">Prospecção por WhatsApp</h1>
    <div class="small opacity-75">Cole os números, abra cada conversa e marque o que já foi enviado.</div>
  </div>
</header>

<main class="container pb-5">

  <section class="card shadow-sm mb-4">
    <div class="card-body">
      <label for="entrada" class="form-label fw-semibold">Números separados por vírgula</label>
      <textarea id="entrada" class="form-control font-monospace" rows="5"
        placeholder="5511987446534, 5521964762829, 553194694478"></textarea>
      <div class="form-text">Use o formato internacional, só com dígitos (ex.: 5548999999999). Espaços, quebras de linha e símbolos são ignorados.</div>
      <div class="d-flex flex-wrap gap-2 mt-3">
        <button id="btnGerar" class="btn btn-primary">Gerar tabela</button>
        <button id="btnLimparCampo" class="btn btn-outline-secondary">Limpar campo</button>
        <button id="btnLimparTudo" class="btn btn-outline-danger ms-auto">Apagar lista</button>
      </div>
      <div id="aviso" class="mt-3" role="status"></div>
    </div>
  </section>

  <section id="painel" class="card shadow-sm d-none">
    <div class="card-body">
      <div class="d-flex flex-wrap align-items-center gap-3 mb-2">
        <div class="fw-semibold"><span id="cEnviados">0</span> de <span id="cTotal">0</span> enviadas</div>
        <div class="text-muted small"><span id="cPendentes">0</span> pendentes</div>
        <div class="btn-group btn-group-sm ms-auto" role="group" aria-label="Filtro">
          <input type="radio" class="btn-check" name="filtro" id="fTodos" value="todos" checked>
          <label class="btn btn-outline-secondary" for="fTodos">Todos</label>
          <input type="radio" class="btn-check" name="filtro" id="fPend" value="pendentes">
          <label class="btn btn-outline-secondary" for="fPend">Pendentes</label>
          <input type="radio" class="btn-check" name="filtro" id="fEnv" value="enviadas">
          <label class="btn btn-outline-secondary" for="fEnv">Enviadas</label>
        </div>
      </div>
      <div class="progress mb-3" role="progressbar" aria-label="Progresso">
        <div id="barra" class="progress-bar" style="width:0%"></div>
      </div>

      <div class="tabela-wrap border rounded">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th scope="col" style="width:4rem">#</th>
              <th scope="col">Número</th>
              <th scope="col" style="width:10rem">WhatsApp</th>
              <th scope="col" class="text-center" style="width:9rem">Prospecção enviada</th>
            </tr>
          </thead>
          <tbody id="corpo"></tbody>
        </table>
      </div>
    </div>
  </section>

</main>

<script>
(function () {
  var CHAVE = "prospeccao_whatsapp_v1";
  var contatos = [];   // [{n: "5511...", ok: false}]
  var el = function (id) { return document.getElementById(id); };

  function salvar() {
    try { localStorage.setItem(CHAVE, JSON.stringify(contatos)); } catch (e) {}
  }
  function carregar() {
    try {
      var s = localStorage.getItem(CHAVE);
      if (s) contatos = JSON.parse(s) || [];
    } catch (e) { contatos = []; }
  }

  function aviso(msg, tipo) {
    el("aviso").innerHTML = msg ? '<div class="alert alert-' + tipo + ' py-2 mb-0">' + msg + '</div>' : "";
  }

  function formatar(n) {
    // Formata números brasileiros (55 + DDD + número) para leitura; os demais ficam como estão.
    var m = /^55(\d{2})(9?\d{4})(\d{4})$/.exec(n);
    return m ? "+55 " + m[1] + " " + m[2] + "-" + m[3] : "+" + n;
  }

  function gerar() {
    var partes = el("entrada").value.split(/[,;\n]+/);
    var existentes = {};
    contatos.forEach(function (c) { existentes[c.n] = true; });
    var novos = 0, repetidos = 0, invalidos = 0;

    partes.forEach(function (p) {
      var n = p.replace(/\D/g, "");
      if (!n) return;
      if (n.length < 10 || n.length > 15) { invalidos++; return; }
      if (existentes[n]) { repetidos++; return; }
      existentes[n] = true;
      contatos.push({ n: n, ok: false });
      novos++;
    });

    salvar();
    render();

    var msg = "<strong>" + novos + "</strong> contato(s) adicionado(s).";
    if (repetidos) msg += " " + repetidos + " repetido(s) ignorado(s).";
    if (invalidos) msg += " " + invalidos + " inválido(s) ignorado(s) (use de 10 a 15 dígitos).";
    aviso(msg, novos ? "success" : "warning");
    if (novos) el("entrada").value = "";
  }

  function filtroAtual() {
    return document.querySelector('input[name="filtro"]:checked').value;
  }

  function render() {
    var total = contatos.length;
    var env = contatos.filter(function (c) { return c.ok; }).length;
    el("painel").classList.toggle("d-none", total === 0);
    el("cTotal").textContent = total;
    el("cEnviados").textContent = env;
    el("cPendentes").textContent = total - env;
    el("barra").style.width = total ? (env / total * 100) + "%" : "0%";

    var f = filtroAtual();
    var html = "";
    contatos.forEach(function (c, i) {
      if (f === "pendentes" && c.ok) return;
      if (f === "enviadas" && !c.ok) return;
      html +=
        '<tr class="' + (c.ok ? "enviada" : "") + '">' +
          '<td class="text-muted">' + (i + 1) + '</td>' +
          '<td class="num">' + formatar(c.n) + '</td>' +
          '<td><a class="btn btn-sm btn-wa ' + (c.ok ? "enviado" : "") + '" href="https://wa.me/' + c.n +
            '" target="_blank" rel="noopener noreferrer" data-n="' + c.n + '">WhatsApp</a></td>' +
          '<td class="text-center"><input type="checkbox" class="form-check-input" data-n="' + c.n + '"' +
            (c.ok ? " checked" : "") + ' aria-label="Prospecção enviada para ' + c.n + '"></td>' +
        '</tr>';
    });
    el("corpo").innerHTML = html ||
      '<tr><td colspan="4" class="text-center text-muted py-4">Nenhum contato neste filtro.</td></tr>';
  }

  function marcar(n, valor) {
    for (var i = 0; i < contatos.length; i++) {
      if (contatos[i].n === n) { contatos[i].ok = valor; break; }
    }
    salvar();
    render();
  }

  el("btnGerar").addEventListener("click", gerar);
  el("btnLimparCampo").addEventListener("click", function () { el("entrada").value = ""; aviso("", ""); });
  el("btnLimparTudo").addEventListener("click", function () {
    if (!contatos.length) return;
    if (confirm("Apagar toda a lista e as marcações de envio?")) {
      contatos = [];
      salvar();
      render();
      aviso("Lista apagada.", "secondary");
    }
  });

  el("corpo").addEventListener("change", function (e) {
    if (e.target.matches('input[type="checkbox"]')) marcar(e.target.getAttribute("data-n"), e.target.checked);
  });
  document.querySelectorAll('input[name="filtro"]').forEach(function (r) {
    r.addEventListener("change", render);
  });

  carregar();
  render();
})();
</script>
</body>
</html>
